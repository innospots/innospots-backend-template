server:
  port: 80

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: true

spring:
  jpa:
    hibernate:
      ddl-auto: none
#      ddl-auto: validate
#      ddl-auto: update
    show-sql: false
    generate-ddl: false



innospots:
  config:
    host: ${SERVER_HOST:http://localhost}:${server.port}
  db:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    jdbc-url: jdbc:mysql://${DB_IP}:${DB_PORT:3306}/${DB_NAME}?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=${DB_TIMEZONE:GMT%2B8}&zeroDateTimeBehavior=CONVERT_TO_NULL
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    maximum-pool-size: 16
    minimum-idle: 4
    pool-name: db-pool
    max-lifetime: 1800000
    idle-timeout: 600000 # millisecond,default ten minute
